meta:
  title: "Documentation Is the King"
  subtitle: "How to Rule Your Agents"
  tagline: "AI Heroes 2026"
  theme: grid-zero
  editing: false

# Every "TODO:" marks content the speaker must write or confirm.
# Source of the structure: _docs/talk/outlient.txt (speaker notes) + _docs/talk/abstract.md.
# Outline and slide-id map: _docs/talk/outline.md

slides:

  # ── 1. Title ────────────────────────────────────────────────────
  - layout: title
    id: cover
    h1: "Documentation Is the King"
    subtitle: "Marco De Nittis - Architect @ Synesthesia"
    tagline: "How to Rule Your Agents"

  # ── 2. Hook ─────────────────────────────────────────────────────
  - layout: quote
    id: hook
    quote: "Your agent has read every word you wrote. And it believes all of them."
    attribution: "Did you read them?"

  # HIDDEN — uncomment to show
  # # ── 3. Agenda ───────────────────────────────────────────────────
  # - layout: steps
  #   id: agenda
  #   h2: "Today"
  #   steps:
  #     - h3: "Introduction"
  #       text: "Context, control, efficiency"
  #     - h3: "Code documents"
  #       text: "Tech docs for developers and agents"
  #     - h3: "Functional documents"
  #       text: "Analysis, offers, estimates"
  #     - h3: "Takeaways"
  #       text: "What to do on Monday"

  # ══════════════════════════════════════════════════════════════
  # ACT 1 — Introduction
  # ══════════════════════════════════════════════════════════════

  # HIDDEN — uncomment to show
  # # ── 4. Act 1 divider ────────────────────────────────────────────
  # - layout: section-divider
  #   id: act1-intro
  #   h2: "Introduction"
  #   tagline: "Docs used to slow us down. Now they drive."

  # ── 3. The flip ─────────────────────────────────────────────────
  - layout: two-column
    id: the-flip
    h2: "The flip"
    columns:
      - h3: "Before agents"
        items:
          - "Written late"
          - "Read rarely"
          - "Stale by the next release"
      - h3: "With agents"
        items:
          - "Agents act on what is written"
          - "Docs are the input, not the afterthought"
          - "Docs decide how fast and how well AI delivers"

  # ── 4. Kinds of documentation ───────────────────────────────────
  - layout: fullpage
    id: doc-kinds
    h2: "Not all documents are the same"
    items:
      - "What — technical, functional, offers, estimates, emails"
      - "Who — agents, technical humans, functional humans, business"
      - "Durability — long-lived or short-lived"
      - "Stability — one shot or evolving"
      - "Context — a single document or part of an ecosystem"
      - "Use — reference, read often — or read once"
    note: "Bottom line: different targets, different approaches."

  # ── 5. Principles ───────────────────────────────────────────────
  # ponytail: feature-grid icons are text-only, so the three cards are one composite image
  - layout: fullpage
    id: principles
    h2: "Three principles"
    image: assets/talk/principles.svg
    image_alt: "Context: it is all about context. Control: you set the rules. Efficiency: right info, fewest tokens."

  # ── 6. It is all about context ──────────────────────────────────
  - layout: two-column
    id: all-about-context
    h2: "It is all about context"
    columns:
      - h3: "Too little"
        items:
          - "Missing information"
          - "The agent fills the gaps by guessing"
      - h3: "Too much"
        items:
          - "Inefficiency: slow and expensive"
          - "Wrong assumptions from noise"
    note: "Context is a limited resource: it costs money and it costs time."

  # ── 7. Claude rage ─────────────────────────────────────────────
  - layout: fullpage
    id: claude-rage
    h2: "Claude rage"
    image: assets/talk/claude-rage.png
    image_alt: "An agent-written report: bold everywhere, dense, emphatic"

  # ── 8. Control ─────────────────────────────────────────────────
  - layout: bullets-note
    id: control
    h2: "Control"
    items:
      - "Stay aware of what the agent writes"
      - "Not reviewing every line of code: OK"
      - "Not reviewing docs written for humans: NEVER"
      - "Define how docs are organized and written"
      - "Lint is also for documents"
    note: "LLMs do not converge: without rules, every run drifts to a mess."

  # ── 9. Efficiency ──────────────────────────────────────────────
  - layout: bullets-strong
    id: efficiency
    h2: "Efficiency"
    items:
      - term: "Effective media"
        desc: "Pick the format the agent reads and writes best"
      - term: "Token usage"
        desc: "Every word in context has a cost"
      - term: "Correct information"
        desc: "Carry only what matters for the task"
      - term: "Small reviews"
        desc: "Whole documents are hard to review: keep changes small"
      - term: "Auto-generation"
        desc: "Aim for docs that maintain themselves"

  # ── 10. Guidelines ──────────────────────────────────────────────
  - layout: bullets
    id: guidelines
    h2: "Guidelines for writing docs"
    items:
      - "Efficient for LLMs and agents"
      - "Controlled style and sentence structure"
      - "Controlled terminology and phrasing"
      - "Low cognitive load, for humans and agents"
      - "Maintainable in the long term"

  # ══════════════════════════════════════════════════════════════
  # ACT 2 — Code documents
  # ══════════════════════════════════════════════════════════════

  # ── 11. Act 2 divider ───────────────────────────────────────────
  - layout: section-divider
    id: act2-code-docs
    h2: "Code documents"
    tagline: "Tech docs, shared by developers and agents"

  # ── 12. Tech docs: types and targets ────────────────────────────
  - layout: two-column
    id: tech-docs
    h2: "Tech docs"
    columns:
      - h3: "Types"
        items:
          - "Code documentation"
          - "Specifications"
          - "Functional docs"
      - h3: "Targets"
        items:
          - "Shared with humans"
          - "Context for agents"

  # ── 13. Constraints ─────────────────────────────────────────────
  - layout: bullets-strong
    id: constraints
    h2: "Constrain the docs"
    items:
      - term: "Structure"
        desc: "The same sections, in the same order"
      - term: "Organization"
        desc: "A predictable folder layout"
      - term: "Metadata"
        desc: "Frontmatter that says what a doc is and when to read it"
      - term: "Length"
        desc: "Balance document size against the number of documents"
      - term: "Controlled language"
        desc: "Restricted grammar and vocabulary"

  # ── 14. Controlled natural language ─────────────────────────────
  - layout: two-column
    id: controlled-language
    h2: "Controlled Natural Language"
    columns:
      - items:
          - "ASD-STE100: Simplified Technical English"
          - "Short sentences, active voice, one instruction each"
          - "A glossary: one word, one meaning"
      - h3: "Before / after"
        code: |
          # Before
          The settlement should probably be
          recalculated whenever it might be
          necessary to do so.

          # After (STE)
          Recalculate the settlement when
          an expense changes.
        language: text

  # ── 15. Media ───────────────────────────────────────────────────
  - layout: two-column
    id: media
    h2: "Choose the media"
    columns:
      - h3: "Text"
        items:
          - "LLMs are strong at text"
          - "They read it and they write it"
      - h3: "Images"
        items:
          - "Useful sometimes"
          - "Easy to read, complex to generate"

  # ── 16. A picture is worth... ───────────────────────────────────
  - layout: quote
    id: picture-words
    quote: "A picture is worth a thousand words."
    attribution: "Sometimes."

  # ── 17. Text-based diagrams ─────────────────────────────────────
  - layout: two-column
    id: text-diagrams
    h2: "Text-based diagrams: agents read and write them"
    columns:
      - code: |
          graph LR
            Docs --> Context
            Context --> Output
            Output -->|update| Docs
        language: text
      - graph: |
          graph LR
            Docs --> Context
            Context --> Output
            Output -->|update| Docs
    note: "A DSL is the good choice: ASCII diagrams, Mermaid, DBML."

  # ── 18. Rich diagrams ───────────────────────────────────────────
  - layout: two-column
    id: rich-diagrams
    h2: "Nice-looking diagrams"
    columns:
      - items:
          - "Very expressive: draw.io, Excalidraw, Archify"
          - "XML or JSON files: they work, but not always"
          - "Better: write a DSL, render it to an image"
          - "Close the loop: the agent looks at the render"
      - graph: |
          graph TD
            A[Agent writes DSL] --> B[Render to image]
            B --> C[Agent reads image]
            C -->|fix| A

  # ══════════════════════════════════════════════════════════════
  # ACT 3 — Functional documents
  # ══════════════════════════════════════════════════════════════

  # ── 19. Act 3 divider ───────────────────────────────────────────
  - layout: section-divider
    id: act3-functional-docs
    h2: "Functional documents"
    tagline: "Docs for people who do not read code"

  # ── 20. Human-targeted documents ────────────────────────────────
  - layout: two-column
    id: human-docs
    h2: "Documents for humans"
    columns:
      - h3: "Tech-oriented"
        items:
          - "Easier: the reader shares the vocabulary"
      - h3: "Stakeholder-oriented"
        items:
          - "Analysis"
          - "Offers"
          - "Estimates"
    note: "Bottom line: with agents it is faster — but not by much."

  # ── 21. What agents get wrong ───────────────────────────────────
  - layout: bullets-strong
    id: agent-pitfalls
    h2: "What agents get wrong"
    items:
      - term: "Chaotic organization"
        desc: "No storyline, ideas in random order"
      - term: "Wrong tone"
        desc: "Emphatic, salesy, or written for the wrong reader"
      - term: "No priorities"
        desc: "Says everything, so the reader finds nothing"

  # ── 22. Structured approach ─────────────────────────────────────
  - layout: steps
    id: structured-approach
    h2: "A structured approach"
    steps:
      - h3: "Build the structure"
        text: "The storytelling first, start from a model"
      - h3: "Define the goals"
        text: "A two-line goal for each paragraph"
      - h3: "Write progressively"
        text: "One paragraph at a time"
      - h3: "Keep a scratch container"
        text: "A file or folder for unstructured notes"

  # ── 23. Rules ───────────────────────────────────────────────────
  - layout: fullpage
    id: writing-rules
    h2: "Give the agent rules"
    image: assets/talk/rules.svg
    image_alt: "Audience, Goal, Tone and style, Organization, Prohibitions, Models"

  # ── 24. Not your garbage bin ────────────────────────────────────
  - layout: bullets
    id: not-garbage-bin
    h2: "The chat is not your garbage bin"
    items:
      - "Structure the reasoning and the storyline"
      - "Share the overview and the context"
      - "Know when you brainstorm and when you build"
      - "Wild exploration is fine — sometimes it is the bin"
      - "Know your tools"

  # ── 25. Advanced techniques ─────────────────────────────────────
  - layout: bullets-strong
    id: advanced-techniques
    h2: "Advanced techniques"
    items:
      - term: "Task DSL"
        desc: "A textual format for a specific task, e.g. estimates"
      - term: "Diagrams"
        desc: "Text-based, so the agent can read and write them"
      - term: "Light formats"
        desc: "Avoid HTML and markup-heavy formats"

  # ── 26. Smart flows ─────────────────────────────────────────────
  - layout: two-column
    id: smart-flows
    h2: "Smart flows"
    columns:
      - items:
          - "Separate content from representation"
          - "Separate intelligence from automation"
          - "Build a DSL — or better, reuse one"
          - "Build a tool that generates the final media"
      - graph: |
          graph TD
            A[Agent<br>intelligence] --> B[Content<br>in a DSL]
            B --> C[Tool<br>automation]
            C --> D[Final media]

  # ── 27. DSL in practice ─────────────────────────────────────────
  - layout: two-column
    id: smart-flows-examples
    h2: "DSL in practice"
    columns:
      - image: assets/talk/pert-dsl.png
        image_alt: "An estimate written in a small textual DSL: role, three-point effort, task"
      - image: assets/talk/slides.png
        image_alt: "The YAML source of this deck"
    note: "Estimates and the current deck"

  # ══════════════════════════════════════════════════════════════
  # ACT 4 — Takeaways
  # ══════════════════════════════════════════════════════════════

  # ── 28. Takeaways ───────────────────────────────────────────────
  - layout: fullpage
    id: takeaways
    h2: "Takeaways"
    image: assets/talk/takeaways.svg
    image_alt: "Discipline, Awareness, Rules and examples, Review, Tools and formats"

  # ── 29. Closing ─────────────────────────────────────────────────
  - layout: title-closing
    id: closing
    h1: "Documentation Is the King"
    items:
      - "Agents act on what is written"
      - "Context is a limited resource: spend it well"
      - "You set the rules — the agent follows them"
    image: assets/talk/thanks.png
    tagline: "TODO: Questions? + contacts / repo link"
